<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7B1F91">
<meta name="apple-mobile-web-app-title" content="Salgsflyten">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Salgsflyten</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f1f6;--card:#fff;--ink:#1d1520;--muted:#6d6274;--accent:#7b1f91;--line:#e4dce8;--bad:#c0392b}
  @media (prefers-color-scheme:dark){:root{--bg:#141016;--card:#1f1923;--ink:#f3eef5;--muted:#a99fb1;--accent:#d897ea;--line:#3a3040;--bad:#ff8f86}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  .card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;display:grid;gap:14px}
  .logo{width:56px;height:56px;border-radius:14px;background:var(--accent) url(icon-192.png) center/cover}
  h1{margin:0;font-size:24px}
  p{margin:0;color:var(--muted);font-size:15px}
  input[type=password]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  label.rem{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
  button{font:inherit;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff}
  button:disabled{opacity:.6}
  .err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="logo" aria-hidden="true"></div>
  <h1>Salgsflyten</h1>
  <p>Skriv inn passordet du har fått for å åpne treningsappen.</p>
  <input type="password" id="pw" placeholder="Passord" aria-label="Passord" autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> Husk meg på denne enheten</label>
  <button id="go" type="submit">Åpne</button>
  <div class="err" id="err" role="alert"></div>
</form>

const KEY="salgsflyten-lock";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryOpen(pw,remember){
  const html=await unlock(pw);
  if(remember){ try{localStorage.setItem(KEY,pw);}catch(e){} }
  show(html);
}
(async()=>{
  let saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved){ try{ await tryOpen(saved,false); return; }catch(e){ try{localStorage.removeItem(KEY);}catch(_){} } }
})();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=document.getElementById("go"), err=document.getElementById("err");
  const pw=document.getElementById("pw").value.trim();
  if(!pw){ err.textContent="Skriv inn passordet."; return; }
  btn.disabled=true; btn.textContent="Åpner …"; err.textContent="";
  try{ await tryOpen(pw,document.getElementById("rem").checked); }
  catch(x){ err.textContent="Feil passord. Prøv igjen."; btn.disabled=false; btn.textContent="Åpne"; }
});
})();
